<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">GoSQLX architecture</title>
  <desc id="d">SQL bytes flow through the tokenizer into a slice of TokenWithSpan, then the parser builds an AST. The formatter, linter, security scanner, transpiler and fingerprinter all consume the AST.</desc>
  <style>
    :root { --bg: #ffffff; --box: #f6f8fa; --stroke: #8c959f; --text: #1f2328; --muted: #656d76; --accent: #0969da; --accent-bg: #ddf4ff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --box: #161b22; --stroke: #6e7681; --text: #e6edf3; --muted: #9198a1; --accent: #58a6ff; --accent-bg: #10243e; }
    }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .bg { fill: var(--bg); }
    .box { fill: var(--box); stroke: var(--stroke); stroke-width: 1.5; }
    .core { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2; }
    .title { font-size: 17px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 16px; text-anchor: middle; fill: var(--muted); }
    .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; }
    .line { stroke: var(--stroke); stroke-width: 1.8; fill: none; }
    .arrow { fill: var(--stroke); }
    .label { font-size: 16px; fill: var(--muted); }
  </style>
  <rect class="bg" width="1200" height="420"/>

  <!-- main pipeline -->
  <rect class="box" x="30" y="150" width="170" height="80" rx="10"/>
  <text class="title" x="115" y="184">SQL bytes</text>
  <text class="sub mono" x="115" y="207">[]byte</text>

  <rect class="core" x="270" y="150" width="190" height="80" rx="10"/>
  <text class="title" x="365" y="184">Tokenizer</text>
  <text class="sub" x="365" y="207">zero-copy, UTF-8</text>

  <rect class="box" x="530" y="150" width="190" height="80" rx="10"/>
  <text class="title mono" x="625" y="184" style="font-size:15px">[]TokenWithSpan</text>
  <text class="sub" x="625" y="207">tokens with positions</text>

  <rect class="core" x="790" y="150" width="150" height="80" rx="10"/>
  <text class="title" x="865" y="184">Parser</text>
  <text class="sub" x="865" y="207">recursive descent</text>

  <rect class="core" x="1010" y="150" width="160" height="80" rx="10"/>
  <text class="title" x="1090" y="184">AST</text>
  <text class="sub" x="1090" y="207">pooled, visitor API</text>

  <path class="line" d="M200 190 H262"/><path class="arrow" d="M270 190 l-10 -5 v10 z"/>
  <path class="line" d="M460 190 H522"/><path class="arrow" d="M530 190 l-10 -5 v10 z"/>
  <path class="line" d="M720 190 H782"/><path class="arrow" d="M790 190 l-10 -5 v10 z"/>
  <path class="line" d="M940 190 H1002"/><path class="arrow" d="M1010 190 l-10 -5 v10 z"/>

  <!-- consumers -->
  <path class="line" d="M1090 230 V268 M1090 268 H110 M110 268 V300 M350 268 V300 M600 268 V300 M850 268 V300 M1090 268 V300"/>
  <path class="arrow" d="M110 310 l-5 -10 h10 z"/>
  <path class="arrow" d="M350 310 l-5 -10 h10 z"/>
  <path class="arrow" d="M600 310 l-5 -10 h10 z"/>
  <path class="arrow" d="M850 310 l-5 -10 h10 z"/>
  <path class="arrow" d="M1090 310 l-5 -10 h10 z"/>
  <text class="label" x="30" y="252">consumers of the AST</text>

  <rect class="box" x="30" y="310" width="160" height="70" rx="10"/>
  <text class="title" x="110" y="340">Formatter</text>
  <text class="sub" x="110" y="362">AST to SQL</text>

  <rect class="box" x="270" y="310" width="160" height="70" rx="10"/>
  <text class="title" x="350" y="340">Linter</text>
  <text class="sub" x="350" y="362">30 rules, L001-L030</text>

  <rect class="box" x="520" y="310" width="160" height="70" rx="10"/>
  <text class="title" x="600" y="340">Security</text>
  <text class="sub" x="600" y="362">injection scanner</text>

  <rect class="box" x="770" y="310" width="160" height="70" rx="10"/>
  <text class="title" x="850" y="340">Transpile</text>
  <text class="sub" x="850" y="362">dialect to dialect</text>

  <rect class="box" x="1010" y="310" width="160" height="70" rx="10"/>
  <text class="title" x="1090" y="340">Fingerprint</text>
  <text class="sub" x="1090" y="362">query normalization</text>

  <text class="label" x="30" y="60" style="font-size:15px;font-weight:600;fill:var(--text)">GoSQLX pipeline</text>
  <text class="label" x="30" y="82">Raw SQL becomes tokens, then an AST. Every tool works on the same tree.</text>
</svg>
