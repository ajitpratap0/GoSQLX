<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">GoSQLX architecture</title>
  <desc id="d">SQL bytes flow through the tokenizer into a slice of TokenWithSpan, then the parser builds an AST. The formatter, linter, security scanner, transpiler and fingerprinter all consume the AST.</desc>
  <style>
    :root { --bg: #ffffff; --box: #f6f8fa; --stroke: #8c959f; --text: #1f2328; --muted: #656d76; --accent: #0969da; --accent-bg: #ddf4ff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --box: #161b22; --stroke: #6e7681; --text: #e6edf3; --muted: #9198a1; --accent: #58a6ff; --accent-bg: #10243e; }
    }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .bg { fill: var(--bg); }
    .box { fill: var(--box); stroke: var(--stroke); stroke-width: 1.5; }
    .core { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2; }
    .title { font-size: 20px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 18px; text-anchor: middle; fill: var(--muted); }
    .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; }
    .line { stroke: var(--stroke); stroke-width: 1.8; fill: none; }
    .arrow { fill: var(--stroke); }
    .label { font-size: 18px; fill: var(--muted); }
  </style>
  <rect class="bg" width="1200" height="420"/>

  <!-- main pipeline -->
  <rect class="box" x="15" y="150" width="150" height="80" rx="10"/>
  <text class="title " x="90" y="182">SQL bytes</text>
  <text class="sub mono" x="90" y="212">[]byte</text>
  <rect class="core" x="220" y="150" width="200" height="80" rx="10"/>
  <text class="title " x="320" y="182">Tokenizer</text>
  <text class="sub " x="320" y="212">zero-copy, UTF-8</text>
  <rect class="box" x="485" y="150" width="200" height="80" rx="10"/>
  <text class="title mono" x="585" y="182" style="font-size:18px">[]TokenWithSpan</text>
  <text class="sub " x="585" y="212">with positions</text>
  <rect class="core" x="740" y="150" width="190" height="80" rx="10"/>
  <text class="title " x="835" y="182">Parser</text>
  <text class="sub " x="835" y="212">recursive descent</text>
  <rect class="core" x="985" y="150" width="190" height="80" rx="10"/>
  <text class="title " x="1080" y="182">AST</text>
  <text class="sub " x="1080" y="212">pooled, visitor</text>

  <path class="line" d="M165 190 H212"/><path class="arrow" d="M220 190 l-10 -5 v10 z"/>
  <path class="line" d="M420 190 H477"/><path class="arrow" d="M485 190 l-10 -5 v10 z"/>
  <path class="line" d="M685 190 H732"/><path class="arrow" d="M740 190 l-10 -5 v10 z"/>
  <path class="line" d="M930 190 H977"/><path class="arrow" d="M985 190 l-10 -5 v10 z"/>

  <!-- consumers -->
  <path class="line" d="M1080 230 V268 M1080 268 H120 M120 268 V300 M360 268 V300 M600 268 V300 M840 268 V300 M1080 268 V300"/>
  <path class="arrow" d="M120 310 l-5 -10 h10 z"/>
  <path class="arrow" d="M360 310 l-5 -10 h10 z"/>
  <path class="arrow" d="M600 310 l-5 -10 h10 z"/>
  <path class="arrow" d="M840 310 l-5 -10 h10 z"/>
  <path class="arrow" d="M1080 310 l-5 -10 h10 z"/>
  <text class="label" x="1062" y="258" style="text-anchor:end">consumers of the AST</text>

  <rect class="box" x="15" y="310" width="210" height="80" rx="10"/>
  <text class="title " x="120" y="342">Formatter</text>
  <text class="sub " x="120" y="372">AST to SQL</text>
  <rect class="box" x="255" y="310" width="210" height="80" rx="10"/>
  <text class="title " x="360" y="342">Linter</text>
  <text class="sub " x="360" y="372">30 rules, L001-L030</text>
  <rect class="box" x="495" y="310" width="210" height="80" rx="10"/>
  <text class="title " x="600" y="342">Security</text>
  <text class="sub " x="600" y="372">injection scanner</text>
  <rect class="box" x="735" y="310" width="210" height="80" rx="10"/>
  <text class="title " x="840" y="342">Transpile</text>
  <text class="sub " x="840" y="372">dialect to dialect</text>
  <rect class="box" x="975" y="310" width="210" height="80" rx="10"/>
  <text class="title " x="1080" y="342">Fingerprint</text>
  <text class="sub " x="1080" y="372">query normalization</text>

  <text class="title" x="15" y="46" style="text-anchor:start;font-size:26px">GoSQLX pipeline</text>
  <text class="label" x="15" y="82">Raw SQL becomes tokens, then an AST. Every tool works on the same tree.</text>
</svg>
