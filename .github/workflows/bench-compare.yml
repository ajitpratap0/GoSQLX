name: Competitor Benchmarks

# Reproducible competitor benchmark harness (issue #673). The harness is its own
# Go module (benchmarks/compare) so `task check` keeps covering only the root
# module; this workflow is the harness's own CI job.
#
# - Pull requests and pushes touching the harness: vet, race tests and a
#   one-pass benchmark smoke run.
# - workflow_dispatch and release tags: a full -count run that publishes the
#   results JSON, the raw benchmark output and a benchstat summary as an
#   artifact. Shared runners are noisy and differ in CPU model from job to
#   job; the JSON and env.txt record the CPU so a run is never presented
#   without its hardware, and the job summary compares GoSQLX with each peer
#   by in-job time ratios rather than absolute ns/op. Commit the artifact to
#   benchmarks/compare/results/ (and website/src/data/) in a PR to publish it.
#
# Both jobs build with PERF_GO_VERSION, the release perf-gate.yml also pins
# (scripts/perf/gate/config_test.go keeps them equal); GOGC=off runs set
# GOMEMLIMIT (cmd/publish -gomemlimit, default as in scripts/perf/lib.sh).

on:
  pull_request:
    paths:
      - 'benchmarks/compare/**'
      - '.github/workflows/bench-compare.yml'
      - 'testdata/realworld/**'
      - 'pkg/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'benchmarks/compare/**'
      - '.github/workflows/bench-compare.yml'
      - 'testdata/realworld/**'
      - 'pkg/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      count:
        description: 'Benchmark repetitions per (query, parser) pair'
        required: false
        default: '10'
      benchtime:
        description: 'go test -benchtime per benchmark (the matrix has about 2300 cells, so keep it short)'
        required: false
        default: '200ms'

permissions:
  contents: read

concurrency:
  group: bench-compare-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: benchmarks/compare

env:
  CGO_ENABLED: '1'
  GOTOOLCHAIN: local
  # One Go release for every perf measurement; perf-gate.yml pins the same.
  PERF_GO_VERSION: '1.26.9'

jobs:
  test:
    name: Harness tests and smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.PERF_GO_VERSION }}
          check-latest: false
          cache-dependency-path: benchmarks/compare/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -timeout 300s ./...

      - name: Benchmark smoke run
        # -cpu 1,4,10 exercises the parallel cells at three widths; the full
        # matrix (GOGC default and off) runs in the publish job.
        run: go test -run='^$' -bench=. -benchmem -benchtime=20x -cpu 1,4,10 .

  publish:
    name: Publish results JSON
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.PERF_GO_VERSION }}
          check-latest: false
          cache-dependency-path: benchmarks/compare/go.sum

      - name: Run harness
        env:
          COUNT: ${{ github.event.inputs.count || '10' }}
          BENCHTIME: ${{ github.event.inputs.benchtime || '200ms' }}
        run: |
          case "$COUNT" in
            ''|*[!0-9]*) echo "count must be a positive integer, got '$COUNT'" >&2; exit 1 ;;
          esac
          case "$BENCHTIME" in
            *[!0-9a-z.]*|'') echo "benchtime must look like 200ms or 100x, got '$BENCHTIME'" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bench"
          {
            echo "cpu model:   $(. ../../scripts/perf/lib.sh && perf_cpu_model)"
            echo "go:          $(go version)"
            echo "kernel:      $(uname -srm)"
            echo "commit:      $(git rev-parse HEAD)"
            echo
            lscpu
          } > "$RUNNER_TEMP/bench/env.txt"
          # The matrix: -cpu 4 and -cpu 1, each with GOGC at its default and
          # off (with GOMEMLIMIT), so mutator CPU can be told apart from GC.
          # The first entry (cpu4, GOGC default) feeds the schema v1 fields.
          go run ./cmd/publish -count="$COUNT" -benchtime="$BENCHTIME" \
            -cpus=4,1 -gogc=default,off \
            -out "$RUNNER_TEMP/bench/latest.json" \
            -raw "$RUNNER_TEMP/bench/latest.txt" \
            -ratios "$RUNNER_TEMP/bench/ratios.md"

      - name: benchstat summary
        run: |
          {
            echo '## Competitor benchmarks'
            echo
            cat "$RUNNER_TEMP/bench/ratios.md"
            echo
            echo '### Absolute numbers (this job and this CPU only)'
            for f in "$RUNNER_TEMP"/bench/latest*.txt; do
              name=$(basename "$f" .txt)
              go run golang.org/x/perf/cmd/benchstat@v0.0.0-20260908200009-22c9c6c9d4da \
                "$f" > "$RUNNER_TEMP/bench/benchstat-$name.txt"
              echo
              echo "<details><summary>$name</summary>"
              echo
              echo '```'
              cat "$RUNNER_TEMP/bench/benchstat-$name.txt"
              echo '```'
              echo
              echo '</details>'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-compare-${{ github.sha }}
          path: ${{ runner.temp }}/bench/
          retention-days: 90
