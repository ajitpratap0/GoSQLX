name: Deploy MCP Server

on:
  push:
    branches: [main]
    paths:
      - 'cmd/gosqlx-mcp/**'
      - 'pkg/mcp/**'
      # The server reports gosqlx.Version; publish-mcp.yml waits for /health to
      # show the tagged version, so a release version bump must redeploy.
      - 'pkg/gosqlx/gosqlx.go'
      - 'Dockerfile'
      - 'render.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -s "$RENDER_DEPLOY_HOOK_URL"
            echo "Deploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK_URL not configured — Render auto-deploys from GitHub"
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
