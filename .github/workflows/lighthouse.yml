name: Lighthouse CI

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  pull_request:
    paths:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install and build website (prebuild compiles the playground WASM)
        run: |
          cd website
          npm ci
          npm run build

      - name: Start local server
        run: |
          cd website
          npx next start -p 3000 &
          sleep 5

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/playground
            http://localhost:3000/docs
          configPath: '.github/lighthouse/lighthouserc.json'
          uploadArtifacts: true

      - name: Check scores
        run: |
          echo "Lighthouse audit complete. Check artifacts for detailed results."
