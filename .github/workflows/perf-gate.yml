name: Perf Gate

# Interleaved A/B performance gate (PLAN section 2.6, task W0-09).
#
# - Pull requests touching library code: base (the PR's merge base) and head
#   test binaries are built in this job and run interleaved by
#   scripts/perf/ab.sh -G: GOGC=off GOMAXPROCS=1 pinned with taskset as the
#   primary metric, an A/A' control, a default-GC secondary metric, and
#   instructions/op from cmd/perfdriver (perf stat, else cachegrind).
#   Each arm is LAYOUTS test binaries linked with -ldflags=-randlayout=<seed>
#   (same seeds for base and head, a disjoint set for the A/A' arm), cycled
#   through the rounds; the gate compares per-layout medians, so a change
#   that only moves code (alignment, aliasing) is not a regression. Runners
#   differ in CPU model (EPYC 7763/9V74/9V45, Xeon 8573C); the report names it.
#   scripts/perf/gate judges the result; the report goes to the job summary,
#   a sticky comment (same-repo PRs only) and an artifact.
# - Adaptive layouts (W0-16): size low-power benchmarks to 80% for a lone
#   +5% slowdown, with up to 600 seconds of extra base/head layouts.
# - Nightly on main: the same gate between main now and main 24 hours ago.
# - workflow_dispatch: mode "gate" with explicit base/head revisions; mode
#   "matrix": the same interleaved A/B over the full benchmark matrix
#   (scripts/perf/matrix-suite.sh, about 900 benchmarks; default 5 rounds of
#   100ms, roughly an hour; base = head gives an A/A of the whole matrix); or
#   mode "profile": pprof (-cpu 1, GOGC=off, -cpu 4) of the gap queries, perf
#   stat counters where the PMU allows, and cachegrind cache simulation (L1i
#   included) for one revision (input to W0-14).
#
# Methodology (W0-15): one pinned Go release (PERF_GO_VERSION, shared with
# bench-compare.yml; GOTOOLCHAIN=local stops go.mod from switching it); every
# GOGC=off run also sets GOMEMLIMIT (scripts/perf/lib.sh, input "gomemlimit");
# every artifact and report names the runner CPU model, and reports compare
# base and head of the same job by ratio only, because hosted runners differ
# in CPU model from job to job.
#
# SHADOW MODE: the gate reports and never fails a PR. After the shadow period,
# set PERF_GATE_ENFORCE to 'true' below; a regression then fails the job
# unless a maintainer applies the perf-regression-accepted label.

on:
  pull_request:
    paths:
      - 'pkg/**'
      - 'internal/**'
      - 'cmd/perfdriver/**'
      - 'go.mod'
      - 'go.sum'
      - 'benchmarks/**'
      - 'scripts/perf/**'
      - '.github/workflows/perf-gate.yml'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'gate: A/B of base vs head over the gated suite; matrix: the same A/B over the full benchmark matrix; profile: CPU profiles, perf counters and cachegrind of head'
        type: choice
        options: [gate, matrix, profile]
        default: gate
      base:
        description: 'gate mode: base revision (default origin/main)'
        required: false
        default: ''
      head:
        description: 'Revision to check out as head (default: the branch this run is dispatched on)'
        required: false
        default: ''
      rounds:
        description: 'gate/matrix mode: interleaved rounds, at least layouts (default 20; matrix 5)'
        required: false
        default: ''
      layouts:
        description: 'gate/matrix mode: randomized code layouts per arm, -ldflags=-randlayout (default 20; matrix: one per round; 0 disables randomization)'
        required: false
        default: ''
      power_budget:
        description: 'gate mode: seconds of adaptive extra layouts for low-power benchmarks (default 600; 0 disables)'
        required: false
        default: '600'
      benchtime:
        description: 'gate/matrix mode: -test.benchtime per run (default 100ms); profile mode: per profile (default 5s)'
        required: false
        default: ''
      gomemlimit:
        description: 'GOMEMLIMIT of the GOGC=off runs (default: scripts/perf/lib.sh; "off" leaves it unset)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: perf-gate-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'gate' }}-${{ inputs.gomemlimit }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  # The one Go release every perf measurement uses; bench-compare.yml pins
  # the same (scripts/perf/gate/config_test.go keeps them equal). 1.26.9 is
  # the toolchain of the recorded C0 baselines.
  PERF_GO_VERSION: '1.26.9'
  PERF_GOMEMLIMIT: ${{ inputs.gomemlimit }}
  PERF_GATE_ENFORCE: 'false'

jobs:
  gate:
    # A matrix dispatch is a report, not a gate verdict: name it so.
    name: ${{ inputs.mode == 'matrix' && 'Matrix A/B (report only)' || 'A/B perf gate (shadow)' }}
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'profile'
    runs-on: ubuntu-latest
    # Gate budget: normal run 13.5 min + up to 10 min adaptive layouts;
    # worst case 21.7 min (forced retry) + 10 = 31.7 min. -E 2100 stops
    # new extension work at 35 min of ab.sh time, inside the 40-min step.
    # The job adds about 1 min of setup and upload and stays capped at 45.
    timeout-minutes: ${{ inputs.mode == 'matrix' && 240 || 45 }}
    steps:
      - name: Validate inputs
        # A GOMEMLIMIT the runtime rejects would make every benchmark binary
        # panic at startup; fail here with a clear input error instead. Same
        # rule as perf_check_gomemlimit in scripts/perf/lib.sh (a test keeps
        # them equal), inlined so it runs before any checked-out code.
        env:
          LIMIT: ${{ inputs.gomemlimit }}
          POWER_BUDGET: ${{ inputs.power_budget }}
        run: |
          case $POWER_BUDGET in
            '') ;;
            *[!0-9]*) echo "::error::power_budget must contain only decimal digits"; exit 1 ;;
          esac
          n=$LIMIT
          case $n in *B) n=${n%B} n=${n%[KMGT]i} ;; esac
          case $LIMIT in
            '' | off) ;;
            *[!0-9A-Za-z]*) bad=1 ;;
            *) case $n in '' | *[!0-9]*) bad=1 ;; esac ;;
          esac
          if [ -n "${bad:-}" ]; then
            echo "::error::gomemlimit must be off or digits with an optional B/KiB/MiB/GiB/TiB suffix (e.g. 64MiB), got '$LIMIT'"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.head || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.PERF_GO_VERSION }}
          check-latest: false
          cache-dependency-path: go.sum

      - name: Install instruction counters (best effort)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends valgrind linux-tools-common "linux-tools-$(uname -r)" >/dev/null ||
            sudo apt-get install -y -qq --no-install-recommends valgrind >/dev/null
          sudo sysctl -w kernel.perf_event_paranoid=1

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260908200009-22c9c6c9d4da

      - name: Resolve base revision
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          case "$EVENT" in
            pull_request)
              # The checkout is the PR merged into its base; its first parent
              # is the base it was merged into, so the diff is exactly the PR.
              if git rev-parse --verify -q HEAD^2 >/dev/null; then base=$(git rev-parse HEAD^1); else base=$PR_BASE_SHA; fi ;;
            schedule)
              base=$(git rev-list -1 --before='24 hours ago' HEAD)
              [ -n "$base" ] || base=$(git rev-parse HEAD) ;;
            *)
              base=${INPUT_BASE:-origin/main}
              base=$(git rev-parse --verify "$base^{commit}") ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Base $base, head $(git rev-parse HEAD)"

      - name: Run perf gate
        id: gate
        continue-on-error: ${{ env.PERF_GATE_ENFORCE != 'true' || inputs.mode == 'matrix' }}
        timeout-minutes: ${{ inputs.mode == 'matrix' && 230 || 40 }}
        env:
          BASE: ${{ steps.refs.outputs.base }}
          MODE: ${{ inputs.mode || 'gate' }}
          ROUNDS: ${{ inputs.rounds }}
          LAYOUTS: ${{ inputs.layouts }}
          BENCHTIME: ${{ inputs.benchtime }}
          POWER_BUDGET: ${{ inputs.power_budget }}
          # Fresh layouts every run and every re-run attempt; the seeds are in
          # the report, so a run can be reproduced with ab.sh -S.
          SEED: ${{ github.run_id }}${{ github.run_attempt }}
          ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'perf-regression-accepted') }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/perf-gate"
          if [ "$MODE" = matrix ]; then
            # The full matrix: base vs head interleaved like the gate, without
            # the A/A arm and instruction counts (too slow at this size). It
            # reports and never fails.
            scripts/perf/matrix-suite.sh > "$RUNNER_TEMP/matrix-suite.txt"
            cp "$RUNNER_TEMP/matrix-suite.txt" "$RUNNER_TEMP/perf-gate/"
            # One randomized layout per round (5 by default), so the matrix
            # also averages over code placement.
            rounds=${ROUNDS:-5}
            flags=(-r "$rounds" -k "${LAYOUTS:-$rounds}" -S "$SEED" -t "${BENCHTIME:-100ms}" -s "$RUNNER_TEMP/matrix-suite.txt" -T 'Matrix A/B')
          else
            # 20 layouts x 1 round each: layout-to-layout spread (2-12% on
            # these runners) dwarfs the sample noise of a 100ms run, so more
            # layouts beat more or longer samples. Measuring takes about as
            # long as the previous 10 rounds of 200ms on one layout.
            flags=(-G -r "${ROUNDS:-20}" -k "${LAYOUTS:-20}" -S "$SEED" -t "${BENCHTIME:-100ms}" -B "${POWER_BUDGET:-600}" -E 2100)
            [ "$PERF_GATE_ENFORCE" = true ] && flags+=(-e)
            [ "$ACCEPTED" = true ] && flags+=(-A)
          fi
          scripts/perf/ab.sh "${flags[@]}" -o "$RUNNER_TEMP/perf-gate" "$BASE" 2>&1 | tee "$RUNNER_TEMP/perf-gate.log"

      - name: Job summary
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MODE: ${{ inputs.mode || 'gate' }}
        run: |
          out="$RUNNER_TEMP/perf-gate"
          mkdir -p "$out"
          if [ ! -f "$out/report.md" ]; then
            {
              echo '<!-- perf-gate-report -->'
              if [ "$MODE" = matrix ]; then
                echo '## Matrix A/B: ERROR (report only, not a gate verdict)'
              else
                echo '## Perf gate: ERROR (shadow mode: report only)'
              fi
              echo
              echo "Runner CPU: \`$(. scripts/perf/lib.sh && perf_cpu_model)\`."
              echo
              echo "The gate did not produce a report; see the \"Run perf gate\" step log of ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Last lines:"
              echo
              echo '```'
              tail -n 30 "$RUNNER_TEMP/perf-gate.log" 2>/dev/null || echo '(no log)'
              echo '```'
            } > "$out/report.md"
          fi
          cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$PR_NUMBER" > "$out/pr-number"
          cp "$RUNNER_TEMP/perf-gate.log" "$out/ab.log" 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-gate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/perf-gate/
            !${{ runner.temp }}/perf-gate/src/
            !${{ runner.temp }}/perf-gate/bin/
          retention-days: 30
          if-no-files-found: warn

  comment:
    name: Sticky PR comment
    needs: gate
    # Fork PRs get a read-only token, so only same-repo PRs get a comment.
    # This job never checks out or runs PR code; it only posts the report.
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.gate.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: perf-gate-${{ github.run_id }}
          path: perf-gate

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- perf-gate-report -->'
          body=perf-gate/report.md
          # GitHub caps comments at 65536 characters; the details sections
          # come last, so truncation keeps the verdict and the main table.
          head -c 60000 "$body" > comment.md
          printf '\n\n[Run, raw data and benchstat](%s)\n' "$RUN_URL" >> comment.md
          id=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -F body=@comment.md >/dev/null
          fi

  profile:
    name: Profiles of the gap queries
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'profile'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.head || '' }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.PERF_GO_VERSION }}
          check-latest: false
          cache-dependency-path: go.sum

      - name: Install perf and valgrind (best effort)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          # valgrind first: cachegrind's cache simulation is the only L1i data
          # on hosted runners, whose virtualised PMU usually lacks perf events.
          sudo apt-get install -y -qq --no-install-recommends valgrind >/dev/null
          sudo apt-get install -y -qq --no-install-recommends linux-tools-common "linux-tools-$(uname -r)" >/dev/null
          sudo sysctl -w kernel.perf_event_paranoid=-1

      - name: Profile
        env:
          BENCHTIME: ${{ inputs.benchtime || '5s' }}
        run: scripts/perf/profile.sh -o "$RUNNER_TEMP/profile" -t "$BENCHTIME" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/profile/
          retention-days: 90
