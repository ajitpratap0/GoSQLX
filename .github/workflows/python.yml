name: Python Bindings

on:
  push:
    branches: [ main ]
    paths:
      - 'pkg/**'
      - 'python/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pkg/**'
      - 'python/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/python.yml'

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pygosqlx:
    name: pygosqlx (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.decoder }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ '3.10', '3.13' ]
        decoder: [ json ]
        extras: [ dev ]
        include:
          - os: ubuntu-latest
            python-version: '3.13'
            decoder: orjson
            extras: dev,orjson

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        # Temporary W8-02 A/B measurement needs the PR merge base.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26'
        check-latest: true

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Build libgosqlx shared library
      working-directory: pkg/cbinding
      run: bash build.sh

    - name: Locate shared library
      shell: bash
      run: |
        case "$(uname -s)" in
          Darwin) ext=dylib ;;
          *) ext=so ;;
        esac
        lib="$GITHUB_WORKSPACE/python/pygosqlx/lib/libgosqlx.$ext"
        test -f "$lib" || { echo "::error::shared library not built at $lib"; exit 1; }
        echo "GOSQLX_LIB_PATH=$lib" >> "$GITHUB_ENV"
        # The raw ctypes ABI harness looks for the library next to pkg/cbinding.
        cp "$lib" "pkg/cbinding/libgosqlx.$ext"

    - name: Install pygosqlx
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e "python[${{ matrix.extras }}]"

    - name: Smoke test (version() twice must not double-free)
      run: python -c "import pygosqlx as p; a = p.version(); b = p.version(); assert a == b, (a, b); print('libgosqlx', a, 'pygosqlx', p.__version__)"

    - name: Run pytest
      run: python -m pytest python/tests -v -rs

    - name: Run raw ctypes ABI tests
      run: python pkg/cbinding/tests/test_ctypes.py -v

    # TEMPORARY W8-02: retain the amd64 tables for review, then remove these
    # measurement/upload steps and fetch-depth override before merge.
    - name: Measure W8-02 interleaved A/B (temporary)
      if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        DECODER: ${{ matrix.decoder }}
      run: |
        base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
        mkdir -p "$RUNNER_TEMP/w8-02-base" "$RUNNER_TEMP/w8-02-results"
        git archive "$base" python | tar -x -C "$RUNNER_TEMP/w8-02-base"
        python python/benchmarks/ab_core.py \
          --base "$RUNNER_TEMP/w8-02-base/python" \
          --head "$GITHUB_WORKSPACE/python" --runs 10 --decoder "$DECODER" \
          > "$RUNNER_TEMP/w8-02-results/amd64-$DECODER.json"

    - name: Upload W8-02 A/B measurements (temporary)
      if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: w8-02-amd64-${{ matrix.decoder }}
        path: ${{ runner.temp }}/w8-02-results/amd64-${{ matrix.decoder }}.json
        if-no-files-found: error
