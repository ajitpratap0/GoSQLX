name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # GoReleaser creates the GitHub release and uploads assets
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26'
        check-latest: true

    - name: Install Task
      run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

    # Runs the pure-Go test suite via Taskfile (test:race excludes pkg/cbinding
    # because it requires CGO). We run cbinding tests separately below with
    # CGO_ENABLED=1 so the tagged release is validated against both build modes.
    - name: Run tests (race, no CGO)
      run: task test:race

    - name: Run cbinding tests (CGO)
      env:
        CGO_ENABLED: '1'
      run: task test:cbinding

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
      with:
        distribution: goreleaser
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload assets
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: dist
        path: dist/