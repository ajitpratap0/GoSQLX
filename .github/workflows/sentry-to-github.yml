name: Sentry Issues → GitHub Issues

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:          # Manual trigger for testing

permissions:
  contents: read

jobs:
  sync:
    name: Sync Sentry Issues to GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # create/update GitHub issues from Sentry
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --require-hashes -r .github/scripts/requirements-sentry.txt

      - name: Sync Sentry issues to GitHub
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          # 31 min (not 30) to overlap slightly with the previous run window,
          # absorbing GitHub Actions scheduling jitter (~1-2 min on busy runners).
          POLLING_MINUTES: '31'
        run: python .github/scripts/sentry_issues.py
