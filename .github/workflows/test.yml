name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true

    - name: Build
      run: go build -v ./...

    - name: Build WASM
      run: GOOS=js GOARCH=wasm go build -o /dev/null ./wasm/

    # Allocation and stack budgets skip under -race where instrumentation
    # changes the measurements, so run them here without it.
    - name: Allocation and stack budgets (non-race)
      run: go test -count=1 -run 'AllocBudget|StackBudget|StackReserve' ./pkg/gosqlx ./internal/stackgrow

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26']
    env:
      # Prevent Go from auto-downloading toolchain which conflicts with setup-go cache
      GOTOOLCHAIN: local

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ matrix.go }}
        check-latest: true
        cache: true

    - name: Get dependencies
      run: go mod download

    - name: Run tests
      run: go test -v -race -coverprofile coverage.txt -covermode atomic ./pkg/...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
      with:
        file: ./coverage.txt
        flags: unittests
        name: codecov-${{ matrix.os }}-${{ matrix.go }}
      continue-on-error: true

  # `task test:race` split across runners (scripts/race-shard.sh): the heavy
  # race packages starve each other on one 4-vCPU runner and cross the
  # 120s per-package timeout. Same packages, flags and timeout as the task.
  race-shard:
    name: Race Detector (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26'
        check-latest: true
        cache: true

    - name: Install Task
      run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

    # pkg/cbinding is excluded - it requires CGO and is exercised separately
    # in the cbinding-race job.
    - name: Run tests with race detector
      run: task test:race:shard SHARD=${{ matrix.shard }} SHARDS=4

  # Required status check name; passes only if every shard passed.
  race-check:
    name: Race Detector
    runs-on: ubuntu-latest
    needs: race-shard
    if: always()
    steps:
    - name: Check race shards
      env:
        RESULT: ${{ needs.race-shard.result }}
      run: |
        echo "race shards: $RESULT"
        [ "$RESULT" = success ]

  cbinding-race:
    name: Race Detector (CGO / cbinding)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26'
        check-latest: true
        cache: true

    - name: Install Task
      run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

    - name: Run cbinding tests (CGO + race)
      env:
        CGO_ENABLED: '1'
      run: task test:cbinding

  readme-quickstart-release:
    name: README quickstart (latest release)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26'
        check-latest: true

    - name: Build README quickstart against the latest tagged release
      run: |
        set -euo pipefail
        dir="$(mktemp -d)"
        # Extract the exact go block readers copy from README.md.
        awk '/^## Quick start/{s=1} s&&/^```go$/{b=1;next} b&&/^```$/{exit} b' README.md > "$dir/main.go"
        test -s "$dir/main.go"
        cd "$dir"
        go mod init readme_quickstart
        # Resolve the latest tagged release explicitly, then pin it in go.mod
        # (module checksums are verified against sum.golang.org by go mod tidy).
        tag="$(go list -m -f '{{.Version}}' github.com/ajitpratap0/GoSQLX@latest)"
        echo "Latest tagged GoSQLX release: ${tag}"
        go mod edit -require="github.com/ajitpratap0/GoSQLX@${tag}"
        go mod tidy
        go build -o /dev/null .
        go run .

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26'
        check-latest: true
        cache: true

    - name: Run benchmarks
      run: |
        go test -run=^$ -bench=. -benchmem -timeout=5m ./pkg/sql/tokenizer/
        go test -run=^$ -bench=. -benchmem -timeout=5m -skip '^BenchmarkParseStage$/^release$' ./pkg/sql/parser/
        go test -run=^$ -bench=. -benchmem -timeout=5m ./pkg/sql/ast/

  perf-regression:
    name: Performance Regression
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26'
        check-latest: true
        cache: true

    - name: Run performance regression tests
      continue-on-error: true
      run: go test -run TestPerformanceRegression -timeout=5m ./pkg/sql/parser/

  fuzz-regression:
    name: Fuzz Regression
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26'
        check-latest: true
        cache: true

    - name: Run fuzz regression (corpus only)
      run: |
        go test -fuzz=FuzzTokenizer -fuzztime=10s -timeout=2m ./pkg/sql/tokenizer/ || true
        go test -fuzz=FuzzScanSQL -fuzztime=10s -timeout=2m ./pkg/sql/security/ || true
