name: Vercel Secret Check

# Validates VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID without deploying.
# Safe to run on any branch: it only reads from Vercel.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vercel-secret-check.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Vercel credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are present and well-formed
        run: |
          fail=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty or not set"
              fail=1
              continue
            fi
            if [ "$value" != "$(printf '%s' "$value" | tr -d '[:space:]')" ]; then
              echo "::error::$name contains whitespace (likely a stray newline from clipboard paste)"
              fail=1
              continue
            fi
            echo "$name is set (${#value} characters)"
          done
          exit $fail

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Authenticate (vercel whoami)
        run: vercel whoami --token="$VERCEL_TOKEN"

      - name: Verify project access (vercel pull)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Summary
        run: |
          {
            echo "### Vercel credentials verified"
            echo ""
            echo "- \`VERCEL_TOKEN\` authenticated successfully"
            echo "- \`VERCEL_ORG_ID\` / \`VERCEL_PROJECT_ID\` resolved to a reachable project"
            echo "- Production environment pulled (no deployment performed)"
          } >> "$GITHUB_STEP_SUMMARY"
