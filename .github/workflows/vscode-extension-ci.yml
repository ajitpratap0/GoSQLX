name: VS Code Extension CI

on:
  push:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-extension-ci.yml'
  pull_request:
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-extension-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compile, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      # Unit tests run under plain mocha; the integration suite needs a VS Code host.
      - name: Unit tests
        run: npm run test:unit
