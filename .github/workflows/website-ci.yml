name: Website CI

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
      - 'README.md'
      - 'llms.txt'
      - 'docs/GETTING_STARTED.md'
      - 'benchmarks/compare/results/**'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
      - 'README.md'
      - 'llms.txt'
      - 'docs/GETTING_STARTED.md'
      - 'benchmarks/compare/results/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Metrics drift check
        run: |
          node scripts/check-metrics-drift.mjs --self-test
          node scripts/check-metrics-drift.mjs

      - name: Build (prebuild compiles the playground WASM)
        run: npm run build
