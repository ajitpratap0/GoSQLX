version: "2"

run:
  timeout: 10m
  tests: false

linters:
  enable:
    - ineffassign
    - unused
    - errcheck
    - govet
    - staticcheck
    - misspell
    - gocritic
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        # ast.textWriter is implemented only by *bytes.Buffer and
        # *strings.Builder, whose writes never return an error.
        - (github.com/ajitpratap0/GoSQLX/pkg/sql/ast.textWriter).WriteString
        - (github.com/ajitpratap0/GoSQLX/pkg/sql/ast.textWriter).WriteByte
    staticcheck:
      checks:
        - "all"
        - "-QF*"
        - "-ST*"
    gocritic:
      disabled-checks:
        - ifElseChain

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
