<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoSQLX analysis</title>
<!--
  GoSQLX analyze_sql report widget.
  Self-contained on purpose: inline CSS/JS, no network requests, no remote
  assets, so it runs under the MCP Apps default CSP (connect-src 'none').
  Data arrives through the MCP Apps postMessage bridge (ui/initialize,
  ui/notifications/tool-input, ui/notifications/tool-result) and, in
  ChatGPT, also through window.openai.toolOutput / openai:set_globals.
  All tool data is rendered with textContent only (no HTML string injection).
-->
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #f6f7f9;
  --border: #e3e6ea;
  --text: #16181d;
  --muted: #5d6573;
  --accent: #0b6bcb;
  --code-bg: #f3f5f8;
  --ok-bg: #e5f6ec; --ok-fg: #13663a;
  --bad-bg: #fdecec; --bad-fg: #a3231f;
  --crit-bg: #fde4e4; --crit-fg: #9b1c1c;
  --high-bg: #feeedd; --high-fg: #9a4a07;
  --med-bg: #fdf6d8; --med-fg: #7a5d00;
  --low-bg: #e8f0fb; --low-fg: #1f4f8f;
  --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
  --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #17181b; --surface: #1f2125; --border: #30333a; --text: #eceef2; --muted: #a2a9b5;
    --accent: #6cb2ff; --code-bg: #121316;
    --ok-bg: #12301f; --ok-fg: #7fdca3; --bad-bg: #3a1716; --bad-fg: #ff9b95;
    --crit-bg: #42161a; --crit-fg: #ff9ea3; --high-bg: #3d2410; --high-fg: #ffbe85;
    --med-bg: #3a3110; --med-fg: #f2d36b; --low-bg: #142a45; --low-fg: #9cc6ff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #17181b; --surface: #1f2125; --border: #30333a; --text: #eceef2; --muted: #a2a9b5;
  --accent: #6cb2ff; --code-bg: #121316;
  --ok-bg: #12301f; --ok-fg: #7fdca3; --bad-bg: #3a1716; --bad-fg: #ff9b95;
  --crit-bg: #42161a; --crit-fg: #ff9ea3; --high-bg: #3d2410; --high-fg: #ffbe85;
  --med-bg: #3a3110; --med-fg: #f2d36b; --low-bg: #142a45; --low-fg: #9cc6ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
#app { padding: 14px 16px 16px; max-width: 100%; overflow-wrap: anywhere; }
.head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.title { font-weight: 600; font-size: 15px; margin: 0; }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.ok { background: var(--ok-bg); color: var(--ok-fg); }
.bad { background: var(--bad-bg); color: var(--bad-fg); }
.sev-CRITICAL, .sev-error { background: var(--crit-bg); color: var(--crit-fg); }
.sev-HIGH { background: var(--high-bg); color: var(--high-fg); }
.sev-MEDIUM, .sev-warning { background: var(--med-bg); color: var(--med-fg); }
.sev-LOW, .sev-info { background: var(--low-bg); color: var(--low-fg); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
details { border: 1px solid var(--border); border-radius: 10px; margin-top: 8px; background: var(--bg); }
summary { cursor: pointer; padding: 9px 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "\25B8"; color: var(--muted); font-size: 11px; transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
summary .count { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 12px; }
.body { padding: 0 12px 12px; }
.muted { color: var(--muted); }
.group { margin-top: 6px; }
.group h4 { margin: 8px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-family: var(--mono); font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; }
.chips.expanded, ul.items.expanded { max-height: 240px; overflow: auto; }
button.more { font: 600 12px var(--font); color: var(--accent); background: none; border: 1px dashed var(--border); border-radius: 6px; padding: 1px 7px; cursor: pointer; }
li > button.more { margin-top: 6px; }
button.more:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
ul.items { list-style: none; margin: 0; padding: 0; }
ul.items li { padding: 8px 0; border-top: 1px solid var(--border); }
ul.items li:first-child { border-top: 0; }
.row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rule { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.loc { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; margin-top: 2px; }
.err { background: var(--bad-bg); color: var(--bad-fg); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
.codewrap { position: relative; }
pre { margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow: auto; max-height: 360px; font: 12.5px/1.5 var(--mono); white-space: pre; }
button.copy { position: absolute; top: 6px; right: 6px; font: 600 12px var(--font); color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button.copy:hover { border-color: var(--accent); color: var(--accent); }
button.copy:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { padding: 18px 4px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main id="app" aria-live="polite"><div class="empty">Waiting for the GoSQLX analysis…</div></main>
<script>
(function () {
  "use strict";

  var state = { input: null, output: null, cancelled: false, error: null };
  var app = document.getElementById("app");
  var SEV_ORDER = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3 };
  // Lists longer than this show their first LIST_CAP items and a "+K more"
  // toggle, so a large result keeps the widget (and the iframe height it asks
  // the host for) bounded.
  var LIST_CAP = 50;
  // Keys of a successful analyze_sql result; an object with none of them is
  // not an analysis.
  var RESULT_KEYS = ["validate", "parse", "metadata", "security", "lint", "format", "errors"];

  // ---- tiny DOM helpers (text nodes only, no HTML parsing of data) ----
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
    return parent;
  }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function obj(v) { return v && typeof v === "object" && !Array.isArray(v) ? v : null; }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  function stmtLabel(t) {
    var s = String(t || "").replace(/^\*?ast\./, "").replace(/Statement$/, "").replace(/Stmt$/, "");
    return s.replace(/([a-z])([A-Z])/g, "$1 $2").toUpperCase() || "UNKNOWN";
  }

  function section(title, count, open) {
    var d = el("details");
    if (open) d.open = true;
    var s = add(el("summary"), el("span", null, title));
    if (count !== undefined) add(s, el("span", "count", count));
    var body = el("div", "body");
    add(d, s, body);
    return { root: d, body: body };
  }

  // cappedList renders items into container with renderItem, showing at most
  // LIST_CAP of them plus a "+K more" / "Show fewer" toggle. The rest are
  // only built on first expand, and an expanded list scrolls inside a fixed
  // max-height instead of growing the widget.
  function cappedList(container, items, renderItem, moreWrapTag) {
    items.slice(0, LIST_CAP).forEach(function (it) { add(container, renderItem(it)); });
    var rest = items.length - LIST_CAP;
    if (rest <= 0) return container;
    var extra = null;
    var btn = el("button", "more", "+" + rest + " more");
    btn.type = "button";
    btn.setAttribute("aria-expanded", "false");
    var toggle = moreWrapTag ? add(el(moreWrapTag), btn) : btn;
    btn.addEventListener("click", function () {
      var expand = btn.getAttribute("aria-expanded") !== "true";
      if (expand && !extra) {
        extra = items.slice(LIST_CAP).map(renderItem);
        extra.forEach(function (n) { container.insertBefore(n, toggle); });
      }
      extra.forEach(function (n) { n.hidden = !expand; });
      container.classList.toggle("expanded", expand);
      btn.setAttribute("aria-expanded", String(expand));
      btn.textContent = expand ? "Show fewer" : "+" + rest + " more";
      if (!expand) container.scrollTop = 0;
      scheduleSize();
    });
    return add(container, toggle);
  }

  function chipGroup(label, items) {
    var g = el("div", "group");
    add(g, el("h4", null, label + " (" + items.length + ")"));
    if (!items.length) return add(g, el("div", "muted", "None"));
    var c = cappedList(el("div", "chips"), items, function (it) { return el("span", "chip", it); });
    return add(g, c);
  }

  // countTypes collapses repeated statement types, in first-seen order:
  // ["SELECT", "SELECT", "INSERT"] -> [["SELECT", 2], ["INSERT", 1]].
  function countTypes(types) {
    var order = [], counts = {};
    types.forEach(function (t) {
      var k = stmtLabel(t);
      if (!Object.prototype.hasOwnProperty.call(counts, k)) { counts[k] = 0; order.push(k); }
      counts[k]++;
    });
    return order.map(function (k) { return [k, counts[k]]; });
  }

  function copyText(text, btn) {
    function done(ok) {
      btn.textContent = ok ? "Copied" : "Copy failed";
      setTimeout(function () { btn.textContent = "Copy"; }, 1500);
    }
    function fallback() {
      try {
        var ta = el("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        done(ok);
      } catch (e) { done(false); }
    }
    // A cross-origin frame without allow="clipboard-write" rejects the async
    // API and the browser logs a console error first, so skip it when the
    // permissions policy says it is blocked.
    var pp = document.permissionsPolicy || document.featurePolicy;
    var blocked = false;
    try { blocked = !!pp && typeof pp.allowsFeature === "function" && !pp.allowsFeature("clipboard-write"); } catch (e) { /* unknown: try the API */ }
    if (!blocked && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else {
      fallback();
    }
  }

  // ---- rendering ----
  function render() {
    var out = state.output;
    app.textContent = "";
    if (!out && state.error !== null) {
      var eh = el("div", "head");
      add(eh, el("h1", "title", "GoSQLX analysis"), el("span", "badge bad", "✗ Analysis failed"));
      add(app, eh, el("div", "err", state.error || "The analyze_sql tool call failed."));
      return;
    }
    if (!out) {
      add(app, el("div", "empty", state.cancelled ? "Analysis was cancelled." : "Waiting for the GoSQLX analysis…"));
      return;
    }

    var validate = obj(out.validate) || {};
    var parse = obj(out.parse) || {};
    var meta = obj(out.metadata) || {};
    var sec = obj(out.security) || {};
    var lint = obj(out.lint) || {};
    var fmt = obj(out.format) || {};
    var errs = obj(out.errors) || {};
    var valid = validate.valid === true;

    var head = el("div", "head");
    add(head, el("h1", "title", "GoSQLX analysis"));
    add(head, el("span", "badge " + (valid ? "ok" : "bad"), valid ? "✓ Valid SQL" : "✗ Invalid SQL"));
    if (validate.dialect) add(head, el("span", "badge chip", validate.dialect));
    add(app, head);

    if (!valid && validate.error) add(app, el("div", "err", validate.error));

    var findings = arr(sec.findings).slice().sort(function (a, b) {
      return (SEV_ORDER[a.severity] ?? 9) - (SEV_ORDER[b.severity] ?? 9);
    });
    var violations = arr(lint.violations).slice().sort(function (a, b) {
      return (a.line || 0) - (b.line || 0) || (a.column || 0) - (b.column || 0);
    });
    var types = arr(parse.statement_types);

    // headline numbers
    var stats = el("div", "stats");
    function stat(n, label) { add(stats, add(el("div", "stat"), el("b", null, n), el("span", null, label))); }
    stat(parse.statement_count !== undefined ? parse.statement_count : "–", "statements");
    stat(arr(meta.tables).length, "tables");
    stat(findings.length, "security findings");
    stat(violations.length, "lint violations");
    add(app, stats);

    // statements
    if (types.length) {
      var st = section("Statements", plural(types.length, "statement", "statements"), true);
      add(st.body, cappedList(el("div", "chips"), countTypes(types), function (p) {
        return el("span", "chip", p[1] > 1 ? p[0] + " ×" + p[1] : p[0]);
      }));
      add(app, st.root);
    }

    // metadata
    if (out.metadata) {
      var md = section("Tables, columns & functions", undefined, true);
      add(md.body,
        chipGroup("Tables", arr(meta.tables)),
        chipGroup("Columns", arr(meta.columns)),
        chipGroup("Functions", arr(meta.functions)));
      add(app, md.root);
    }

    // security
    if (out.security) {
      var sc = section("Security", findings.length ? plural(findings.length, "finding", "findings") : "clean", findings.length > 0);
      if (findings.length) {
        var sevRow = el("div", "row");
        [["CRITICAL", sec.critical_count], ["HIGH", sec.high_count], ["MEDIUM", sec.medium_count], ["LOW", sec.low_count]]
          .forEach(function (p) { if (p[1]) add(sevRow, el("span", "badge sev-" + p[0], p[1] + " " + p[0].toLowerCase())); });
        add(sc.body, sevRow);
        add(sc.body, cappedList(el("ul", "items"), findings, function (f) {
          var li = el("li");
          add(li, add(el("div", "row"),
            el("span", "badge sev-" + f.severity, f.severity),
            el("span", "rule", f.pattern),
            el("span", null, f.description)));
          if (f.risk) add(li, el("div", "hint", "Risk: " + f.risk));
          if (f.suggestion) add(li, el("div", "hint", "Fix: " + f.suggestion));
          return li;
        }, "li"));
      } else {
        add(sc.body, el("div", "muted", "No injection patterns detected."));
      }
      add(app, sc.root);
    }

    // lint
    if (out.lint) {
      var ln = section("Lint", violations.length ? plural(violations.length, "violation", "violations") : "clean", violations.length > 0 && violations.length <= 20);
      if (violations.length) {
        add(ln.body, cappedList(el("ul", "items"), violations, function (v) {
          var li = el("li");
          add(li, add(el("div", "row"),
            el("span", "badge sev-" + v.severity, v.severity),
            el("span", "rule", v.rule + (v.rule_name ? " · " + v.rule_name : "")),
            el("span", "loc", "line " + v.line + ":" + v.column)));
          add(li, el("div", null, v.message));
          if (v.suggestion) add(li, el("div", "hint", v.suggestion));
          return li;
        }, "li"));
      } else {
        add(ln.body, el("div", "muted", "No style violations."));
      }
      add(app, ln.root);
    }

    // formatted SQL (or the original input when formatting failed)
    var sqlText = typeof fmt.formatted_sql === "string" ? fmt.formatted_sql
      : (state.input && typeof state.input.sql === "string" ? state.input.sql : "");
    if (sqlText) {
      var fs = section(fmt.formatted_sql !== undefined ? "Formatted SQL" : "SQL", undefined, true);
      var wrap = el("div", "codewrap");
      var btn = el("button", "copy", "Copy");
      btn.type = "button";
      btn.setAttribute("aria-label", "Copy SQL to clipboard");
      btn.addEventListener("click", function () { copyText(sqlText, btn); });
      add(wrap, add(el("pre"), el("code", null, sqlText)), btn);
      add(fs.body, wrap);
      add(app, fs.root);
    }

    // other sub-tool errors (e.g. parse/format skipped on invalid SQL)
    var errKeys = Object.keys(errs).filter(function (k) { return k !== "validate" || !validate.error; });
    if (errKeys.length) {
      var es = section("Skipped checks", String(errKeys.length), !valid);
      var eul = el("ul", "items");
      errKeys.forEach(function (k) {
        add(eul, add(el("li"), el("span", "rule", k), el("div", "hint", errs[k])));
      });
      add(es.body, eul);
      add(app, es.root);
    }
  }

  function isAnalysis(o) {
    return !!o && RESULT_KEYS.some(function (k) { return Object.prototype.hasOwnProperty.call(o, k); });
  }

  // errorText picks a message out of an error-shaped value: a string, or an
  // object with a string error/message field.
  function errorText(v) {
    if (typeof v === "string") return v;
    var o = obj(v);
    if (!o) return "";
    if (typeof o.error === "string") return o.error;
    if (obj(o.error) && typeof o.error.message === "string") return o.error.message;
    if (typeof o.message === "string") return o.message;
    return "";
  }

  function showOutput(o) { state.output = o; state.error = null; state.cancelled = false; render(); }
  function showError(msg) { state.output = null; state.error = String(msg || ""); state.cancelled = false; render(); }

  // applyToolResult handles a CallToolResult from ui/notifications/tool-result
  // (or a ChatGPT toolOutput that carries one). A failed call (isError, or a
  // result with no analysis in it) shows an error state instead of waiting.
  function applyToolResult(res) {
    res = obj(res);
    if (!res) return;
    var sc = obj(res.structuredContent);
    var text = "";
    if (Array.isArray(res.content)) {
      for (var i = 0; i < res.content.length; i++) {
        var c = res.content[i];
        if (!c || c.type !== "text" || typeof c.text !== "string") continue;
        if (!text) text = c.text;
        if (!sc) { try { sc = obj(JSON.parse(c.text)); } catch (e) { /* not JSON */ } }
      }
    }
    if (res.isError === true) { showError(errorText(sc) || text); return; }
    if (isAnalysis(sc)) { showOutput(sc); return; }
    if (sc || text || Object.prototype.hasOwnProperty.call(res, "content")) showError(errorText(sc) || text);
  }

  // applyOpenAIOutput handles window.openai.toolOutput, which is normally the
  // structuredContent itself but may be a CallToolResult or an error object.
  function applyOpenAIOutput(o) {
    o = obj(o);
    if (!o) return;
    if (isAnalysis(o)) { showOutput(o); return; }
    if (Object.prototype.hasOwnProperty.call(o, "isError") || Array.isArray(o.content)) { applyToolResult(o); return; }
    var msg = errorText(o);
    if (msg) showError(msg);
  }

  // ---- theming ----
  function setTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  }
  function applyHostContext(ctx) {
    ctx = obj(ctx);
    if (!ctx) return;
    setTheme(ctx.theme);
    var vars = ctx.styles && obj(ctx.styles.variables);
    if (vars) {
      ["--font-sans", "--font-mono"].forEach(function (k) {
        if (typeof vars[k] === "string" && vars[k]) document.documentElement.style.setProperty(k, vars[k]);
      });
    }
  }

  // ---- MCP Apps bridge (JSON-RPC 2.0 over postMessage) ----
  var hasParent = window.parent && window.parent !== window;
  var nextId = 1;
  var pending = {};
  function post(msg) { if (hasParent) window.parent.postMessage(msg, "*"); }
  function notify(method, params) { post({ jsonrpc: "2.0", method: method, params: params || {} }); }
  function request(method, params) {
    var id = nextId++;
    post({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
      setTimeout(function () {
        if (pending[id]) { delete pending[id]; reject(new Error("timeout: " + method)); }
      }, 15000);
    });
  }

  window.addEventListener("message", function (ev) {
    if (ev.source !== window.parent) return;
    var m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;

    if (m.id !== undefined && m.id !== null && !m.method) {
      var p = pending[m.id];
      if (p) { delete pending[m.id]; if (m.error) p.reject(m.error); else p.resolve(m.result); }
      return;
    }
    switch (m.method) {
      case "ui/notifications/tool-input":
        state.input = obj(m.params && m.params.arguments);
        render();
        break;
      case "ui/notifications/tool-result":
        applyToolResult(m.params);
        break;
      case "ui/notifications/tool-cancelled":
        state.cancelled = true;
        render();
        break;
      case "ui/notifications/host-context-changed":
        applyHostContext(m.params);
        break;
      case "ui/resource-teardown":
      case "ping":
        if (m.id !== undefined) post({ jsonrpc: "2.0", id: m.id, result: {} });
        break;
    }
  });

  // ---- size reporting so the host can fit the iframe ----
  var lastW = 0, lastH = 0, queued = false;
  function reportSize() {
    queued = false;
    // Measure the content, not the viewport: documentElement.scrollHeight never
    // drops below the iframe height, so the widget could grow but never shrink
    // (e.g. after collapsing a section).
    var h = Math.ceil(app.getBoundingClientRect().height);
    var w = Math.ceil(document.documentElement.scrollWidth);
    if (h === lastH && w === lastW) return;
    lastH = h; lastW = w;
    notify("ui/notifications/size-changed", { width: w, height: h });
    if (window.openai && typeof window.openai.notifyIntrinsicHeight === "function") {
      try { window.openai.notifyIntrinsicHeight(h); } catch (e) { /* ignore */ }
    }
  }
  function scheduleSize() { if (!queued) { queued = true; requestAnimationFrame(reportSize); } }

  // ---- ChatGPT window.openai compatibility (optional) ----
  function readOpenAI() {
    var oa = window.openai;
    if (!oa) return;
    setTheme(oa.theme);
    if (obj(oa.toolInput)) state.input = oa.toolInput;
    applyOpenAIOutput(oa.toolOutput);
  }
  window.addEventListener("openai:set_globals", function (ev) {
    var g = ev && ev.detail && ev.detail.globals;
    if (!g) return;
    if (g.theme) setTheme(g.theme);
    if (obj(g.toolInput)) state.input = g.toolInput;
    applyOpenAIOutput(g.toolOutput);
  });

  // ---- boot ----
  render();
  readOpenAI();
  if (typeof ResizeObserver === "function") new ResizeObserver(scheduleSize).observe(app);
  document.addEventListener("toggle", scheduleSize, true);

  if (hasParent) {
    request("ui/initialize", {
      // ext-apps SDK sends appInfo; the spec's raw example uses clientInfo. Send both.
      appInfo: { name: "gosqlx-analysis", version: "1.0.0" },
      clientInfo: { name: "gosqlx-analysis", version: "1.0.0" },
      appCapabilities: { availableDisplayModes: ["inline"] },
      protocolVersion: "2026-01-26"
    }).then(function (res) {
      applyHostContext(res && res.hostContext);
      notify("ui/notifications/initialized", {});
      scheduleSize();
    }, function () {
      // Host without the MCP Apps bridge (e.g. legacy ChatGPT skybridge): window.openai covers it.
      scheduleSize();
    });
  }
})();
</script>
</body>
</html>
