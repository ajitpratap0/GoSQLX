[build-system]
# setuptools>=77: PEP 639 SPDX license metadata; setup.py only customizes
# bdist_wheel so the wheel carries a platform tag (see setup.py).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pygosqlx"
version = "1.17.0"
description = "Python bindings for GoSQLX - High-performance SQL parser"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "GoSQLX Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://github.com/ajitpratap0/GoSQLX/tree/main/python#readme"
Homepage = "https://github.com/ajitpratap0/GoSQLX"
Repository = "https://github.com/ajitpratap0/GoSQLX"
Issues = "https://github.com/ajitpratap0/GoSQLX/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["pygosqlx*"]

[tool.setuptools.package-data]
pygosqlx = ["lib/libgosqlx.*", "py.typed"]
